services:
  fraud-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FRAUD_MODEL_PATH: /app/artifacts/model.joblib
      FRAUD_METADATA_PATH: /app/artifacts/metadata.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

